# Standalone cargo package (NOT part of a cargo workspace — the monorepo root
# has no Cargo.toml, so this crate builds on its own). The Rust side is
# deliberately THIN: it opens the obsidian window and exposes three OS-scoped
# secret commands. All orchestration (multi-model compare, cascade, savings)
# is the SERVER's job — there is no AI logic in this binary.
[package]
name = "braavolabs-desktop"
version = "0.1.1"
description = "Braavolabs Desktop — native multi-model chat & cascade control."
edition = "2021"
rust-version = "1.77"

[lib]
name = "braavolabs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2" # S-012: native OS approval dialog (webview-unforgeable)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# oneshot channel + bounded timeout for the async, non-blocking native dialog
# await (see native_confirm); plus the async I/O the R6 Lane-C CDP browser host
# drives (net = the TcpStream under tokio-tungstenite + the DevTools /json fetch,
# io-util = read/write, rt = the smoke test's single-thread runtime).
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "rt"] }
# R6 Lane-B real-PTY host: a genuine pseudo-terminal for governed, interactive
# vendor-CLI sessions (claude/codex) inside the app. Cross-platform (openpty on
# unix, ConPTY on Windows) so the one host path serves every shipping target.
portable-pty = "0.9"
# R6 Lane-C governed CDP browser host: the real BrowserDriver src/browser.ts
# injects. tokio-tungstenite is the async WebSocket client to a Chrome DevTools
# page target (ws:// only — no TLS feature pulled in, DevTools is loopback);
# futures-util gives the Sink/Stream (send/next) extension traits it needs.
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# OS keychain (S-010) — only on the platforms this app actually ships to
# (macOS Keychain / Windows Credential Manager). Deliberately NOT pulled in on
# Linux/other: those keep the 0600-file fallback, so no dbus/secret-service
# system dependency is dragged into a Linux `cargo check` (CI never builds this
# crate anyway; keeping the dep target-scoped avoids surprising a Linux dev).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }

# Dismiss a stale native approval sheet after Kill/expiry (macOS). Same
# objc2-app-kit 0.3.2 that rfd/tauri already lock; only the NSWindow API is used.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSResponder"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
