<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP is enforced authoritatively by src-tauri/tauri.conf.json (app.security.csp).
      This meta tag mirrors it so `vite build` / a plain browser preview behaves the
      same: self plus the existing platform, local-model and BYOK connections.
      Script execution remains self only; no inline scripts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://braavolabs.com https://*.braavolabs.com http://localhost:11434 https://api.anthropic.com https://api.openai.com https://api.groq.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>Braavolabs</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
