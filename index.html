<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP is enforced authoritatively by src-tauri/tauri.conf.json (app.security.csp).
      This meta tag mirrors it so `vite build` / a plain browser preview behaves the
      same: selected HTTPS self-hosts plus loopback models/APIs; no remote HTTP.
      Script execution remains self only; no inline scripts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <script src="/theme-init.js"></script>
    <title>Braavolabs</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
